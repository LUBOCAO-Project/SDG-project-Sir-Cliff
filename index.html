    #map {

    footer {

    .footer-contacts {

    .footer-contacts div {
        margin:5px 0;
        font-size:14px;
    }
</style>

</div>

<div class="city-title">MANOLO FORTICH BUKIDNON</div>

<div id="map"></div>

<script>
// Load Map
var map = L.map('map').setView([8.368018729044264, 124.8664225779766], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}).addTo(map);

const popupContent = `
    <div style="text-align:center;">
        <img src="https://lh3.googleusercontent.com/gps-cs-s/AG0ilSzpI-dX6lQJ9dP37CtyNLI2Wv-SPcu6BstxII9ljcaUDfLS1nZV9ygq6zUt4SfmIIaSkn5PvWRabnU8venU5uk-oDQB5k1vHE1yI-FWvOGUiSW8V4haQ4nyw2fWD_nOtwyTjEM0CQ=w408-h302-k-no"
             style="width:100%; height:120px; object-fit:cover; border-radius:6px; margin-bottom:8px;">

        <h3 style="font-size:16px; margin-bottom:5px;">Manolo Fortich</h3>
        <p style="font-size:13px; line-height:1.4;">
            Known for its strong community involvement and environmental programs.
        </p>

        <div id="weather-box">
            <p>Loading weather...</p>
        </div>
    </div>
`;

// Marker
const marker = L.marker([8.368050494910758, 124.86630281133502])
    .addTo(map)
    .bindPopup(popupContent);

// WEATHER API
const apiKey = "510cef28f603cd44237f98ba79ae8499";
const lat = 8.3699;
const lon = 124.8643;

async function loadPopupWeather() {
    const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;

    const res = await fetch(url);
    const data = await res.json();

    const icon = data.weather[0].icon;

    const weatherHTML = `
        <img src="https://openweathermap.org/img/wn/${icon}@2x.png" style="width:60px;">
        <p><b>${data.main.temp}°C</b></p>
        <p>${data.weather[0].description}</p>
    `;

    document.getElementById("weather-box").innerHTML = weatherHTML;
}

// load weather
map.on("popupopen", function () {
    loadPopupWeather();
});
</script>
