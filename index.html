<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Community E - Home</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body {
       background:#ffffff;
       padding-top: 60px;
      }

    header {
        width:100%;
        background:black;
        color:white;
        padding:35px 20px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 999;
    }

    .hero-container {
    position: relative;
    width: 100%;
}

.hero-img {
    width: 100%;
    height: 600px;
    object-fit: cover;
}

.slogan-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    color: white;
    font-size: 30px;
    font-weight: 600;
    background: rgba(0, 0, 0, 0.4); 
    padding: 8px 15px;
    border-radius: 6px;
    text-align: center;
}

    header .logo-text { font-size:18px; font-weight:bold; }
    header nav a {
        color:white;
        margin-left:20px;
        text-decoration:none;
        font-size:14px;

    }

    .city-title {
        font-size:22px;
        font-weight:600;
        margin-left:20px;
        margin-bottom:10px;
    }

    .section-title { margin-left:20px; margin-bottom:10px; font-weight:600; }

    .cards {
        display:flex;
        gap:10px;
        padding:0 20px;
        margin-bottom:20px;
    }
    .card {
        background:#dcdcdc;
        width:100%;
        text-align:center;
        padding:10px;
        border-radius:4px;
        font-size:12px;
    }
    .card button {
        margin-top:5px;
        background:#99c77d;
        border:none;
        padding:5px 10px;
        font-size:12px;
        cursor:pointer;
        border-radius:4px;
    }

    #map {
    height: 400px;
    width: 70%;
    margin: 20px auto;
    border-radius: 10px;
}


   footer {
    background:black;
    color:white;
    padding:25px 0;
    margin-top:40px;
    text-align:center;
}

.footer-title {
    font-size:30px;
    font-weight:600;
    margin-bottom:15px;
    text-align: left;
}

.footer-contacts {
    display: inline-block;      
    text-align: left;           
}

.footer-contacts div {
    margin:5px 0;
    font-size:14px;
}

</style>
</head>
<body>

<header>
    <div class="logo-text">COMMUNITY CONNECT</div>
    <nav>
        <a href="about.html">ABOUT</a>
        <a href="signin.html">SIGN IN</a>
    </nav>
</header>

<div class="hero-container">
    <img src="https://images.pexels.com/photos/325521/pexels-photo-325521.jpeg?cs=srgb&dl=pexels-leah-newhouse-50725-325521.jpg&fm=jpg" class="hero-img" alt="">
    <div class="slogan-text">Together for a Sustainable Community</div>
</div>


<div class="city-title">Manolo Fortich</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<div id="map"></div>


<div class="section-title">Latest Announcements:</div>
<div class="cards">
   
  <div class="card">
    Community Clean Up Drive<br>
    <a href="cleanupdrive.html">
        <button>View</button>
    </a>
</div>
    <div class="card">Tree Planting Program<br><button>View</button></div>
    <div class="card">Recycling and Waste Management Program<br><button>View</button></div>
</div>

<script>
    var map = L.map('map').setView([8.368018729044264, 124.8664225779766], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    L.marker([8.3699, 124.8643]).addTo(map)
        .bindPopup("Manolo Fortich, Bukidnon")
        .openPopup();
</script>


<footer>
    <p class="footer-title">We Can Make Something</p>
    <p class="footer-title">Great Together</p>

    <div class="footer-contacts">
        <div>📘 CC Facebook Page</div>
        <div>📷 CommunityConnect</div>
        <div>✉️ ComConnectgmail.com</div>
    </div>
</footer>

</body>
</html>
