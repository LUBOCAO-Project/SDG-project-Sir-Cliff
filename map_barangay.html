<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Map & Barangay Updates</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body { background:white; }

    /* HEADER */
    header {
        width:100%;
        background:black;
        color:white;
        padding:10px 20px;
        display:flex;
        align-items:center;
        justify-content:space-between;
    }
    header .logo-text { font-size:18px; font-weight:bold; }
    header nav a { color:white; margin-left:20px; text-decoration:none; font-size:14px; }

    /* SECTION WRAPPER */
    .wrapper { padding:20px; }

    /* JOIN US BUTTON */
    .join-btn {
        width:90%;
        margin:10px auto 20px;
        background:#b6d989;
        text-align:center;
        padding:10px;
        border-radius:8px;
        font-weight:600;
        font-size:16px;
    }

    /* MAP TEXT BOX */
    .map-box {
        width:90%;
        margin:0 auto;
        background:#dcdcdc;
        padding:30px 20px;
        border-radius:6px;
        text-align:center;
        font-family:'Comic Sans MS';
        font-size:18px;
        margin-bottom:20px;
    }

    /* BARANGAY SECTION */
    .barangay-title {
        font-size:16px;
        font-weight:600;
        margin-left:20px;
        margin-bottom:10px;
    }
    .barangay-img {
        width:90%;
        margin:0 auto 20px;
        border-radius:6px;
    }

    /* FOOTER */
    footer {
        background:black;
        color:white;
        padding:20px;
        text-align:left;
        margin-top:20px;
    }
    footer p { margin-bottom:10px; font-size:14px; }
    .contact div { margin-bottom:5px; }
</style>
</head>
<body>

<header>
    <div class="logo-text">COMMUNITY E</div>
    <nav>
        <a href="about.html">ABOUT</a>
        <a href="signin.html">SIGN IN</a>
    </nav>
</header>

<div class="wrapper">

    <div class="join-btn">Join Us!</div>

    <div class="map-box">
        Map location if where the clean up drive held on using Leaflet,<br>
        also can identify weather using OpenWeather
    </div>

    <div class="barangay-title">Barangay Sto Nino Clean Up Drive</div>
    <img src="sto_nino.jpg" class="barangay-img" />

    <div class="barangay-title">Barangay San Miguel Clean Up Drive</div>
    <img src="san_miguel.jpg" class="barangay-img" />

</div>

<footer>
    <p>Same design Footer</p>
    <div class="contact">
        <div>📘 Kim Lucero</div>
        <div>📷 Jst Yuuki</div>
        <div>✉️ Yuuki.lucero@gmail.com</div>
    </div>
</footer>

</body>
</html>
