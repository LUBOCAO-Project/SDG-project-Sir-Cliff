<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>COMMUNITY CONNECT - SIGN IN PAGE</title>

<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body { 
        background:white;
        padding-top: 120px;
    }

    header {
        width:100%;
        background:black;
        color:white;
        padding:50px 20px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        position: fixed;
        top: 0;
        z-index: 999;
    }

    .hero-container {
        position: relative;
        width: 100%;
    }

    .hero-img {
        width: 100%;
        height: 400px;
        object-fit: cover;
    }

    .slogan-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 35px;
        font-weight: 600;
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 15px;
        border-radius: 6px;
        text-align: center;
    }

    header .logo-text { font-size:18px; font-weight:bold; }
    header nav a {
        color:white;
        margin-left:20px;
        text-decoration:none;
        font-size:14px;
    }

    .signin-box {
        width:30%;
        margin:40px auto;
        background:#dcdcdc;
        padding:40px 20px;
        border-radius:6px;
        text-align:center;
    }

    .signin-title {
        font-family:'Comic Sans MS';
        font-size:26px;
        font-weight:700;
        margin-bottom:30px;
    }

    .input-field {
        width:90%;
        padding:10px;
        margin:10px auto;
        display:block;
        border-radius:5px;
        border:1px solid #aaa;
        font-size:14px;
    }

    .signin-btn {
        width:90%;
        padding:10px;
        background:#b6d989;
        border:none;
        font-size:16px;
        border-radius:8px;
        font-weight:600;
        cursor:pointer;
        margin-top:15px;
    }

    footer {
        background:black;
        color:white;
        padding:25px 0;
        margin-top:40px;
        text-align:center;
    }

    .footer-title {
        font-size:30px;
        font-weight:600;
        margin-bottom:5px;
        text-align: left;
    }

    .footer-contacts {
        display: inline-block;
        text-align: left;
    }

    .footer-contacts div {
        margin:5px 0;
        font-size:14px;
    }

</style>
</head>
<body>

<header>
    <div class="logo-text">COMMUNITY E</div>

    <nav>
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
    </nav>
</header>

<div class="hero-container">
    <img src="https://images.pexels.com/photos/325521/pexels-photo-325521.jpeg" class="hero-img" alt="">
    <div class="slogan-text">Together for a Sustainable Community</div>
</div>

<div class="signin-box">
    <div class="signin-title">SIGN IN</div>

    <input type="text" placeholder="Email" class="input-field" />
    <input type="password" placeholder="Password" class="input-field" />

    <!-- ✅ Step 2 added here -->
    <button class="signin-btn" onclick="login()">Sign In</button>
</div>

<footer>
    © <span id="year"></span> by Community Connect | Me-ah Ui
</footer>

<script>
// Step 2: Save login status
function login() {
    localStorage.setItem("loggedIn", "true");
    window.location.href = "index.html"; // redirect to home
}

// Footer year script
document.getElementById("year").innerHTML = new Date().getFullYear();
</script>

</body>
</html>
