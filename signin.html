<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIGN IN - Community E</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body { background:white; }

    /* HEADER */
    header {
        width:100%;
        background:black;
        color:white;
        padding:35px 20px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 999;
    }

    .hero-container {
    position: relative;
    width: 100%;
}

.hero-img {
    width: 100%;
    height: 600px;
    object-fit: cover;
}

/* Centered slogan */
.slogan-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    color: white;
    font-size: 30px;
    font-weight: 600;
    background: rgba(0, 0, 0, 0.4);  /* optional darken for readability */
    padding: 8px 15px;
    border-radius: 6px;
    text-align: center;
}

    header .logo-text { font-size:18px; font-weight:bold; }
    header nav a {
        color:white;
        margin-left:20px;
        text-decoration:none;
        font-size:14px;

    }

    /* SIGN IN BOX */
    .signin-box {
        width:90%;
        margin:40px auto;
        background:#dcdcdc;
        padding:40px 20px;
        border-radius:6px;
        text-align:center;
    }
    .signin-title {
        font-family:'Comic Sans MS';
        font-size:26px;
        font-weight:700;
        margin-bottom:30px;
    }
    .input-field {
        width:90%;
        padding:10px;
        margin:10px auto;
        display:block;
        border-radius:5px;
        border:1px solid #aaa;
        font-size:14px;
    }
    .signin-btn {
        width:90%;
        padding:10px;
        background:#b6d989;
        border:none;
        font-size:16px;
        border-radius:8px;
        font-weight:600;
        cursor:pointer;
        margin-top:15px;
    }

    /* FOOTER */
    footer {
        background:black;
        color:white;
        padding:20px;
        margin-top:40px;
    }
    footer p { margin-bottom:10px; font-size:14px; }
    .contact div { margin-bottom:5px; }
</style>
</head>
<body>

<header>
    <div class="logo-text">COMMUNITY E</div>
    <nav>

        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="signin.html">SIGN IN</a>
        
    </nav>
</header>

<div class="signin-box">
    <div class="signin-title">SIGN IN</div>
    <input type="text" placeholder="Email" class="input-field" />
    <input type="password" placeholder="Password" class="input-field" />
    <button class="signin-btn">Sign In</button>
</div>

<footer>
    <p>Same design Footer</p>
    <div class="contact">
        <div>📘 Kim Lucero</div>
        <div>📷 Jst Yuuki</div>
        <div>✉️ Yuuki.lucero@gmail.com</div>
    </div>
</footer>

</body>
</html>
